<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{const s=JSON.parse(localStorage.getItem('svn_layout_state')||'{}');if(s.isAdmin)document.documentElement.dataset.preShell='admin';}catch(e){}})()</script>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#AC3631" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validação de Equipe — Hub SVN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600;6..12,700&family=Taviraj:wght@300;400&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600;6..12,700&family=Taviraj:wght@300;400&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600;6..12,700&family=Taviraj:wght@300;400&display=swap"></noscript>
  <link rel="stylesheet" href="style.css">
  <style>
    .page-container--wide { max-width: min(1400px, 96vw); }
    .va-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 16px; border-bottom: 1px solid var(--border-light); }
    .va-tab { cursor: pointer; padding: 9px 16px; border: none; background: none; font-size: 0.9rem; color: var(--ink-60); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 8px; }
    .va-tab.active { color: var(--carbon-black); border-bottom-color: var(--ruby-red); font-weight: 600; }
    .va-tab .cnt { font-size: 0.72rem; background: var(--icon-bg); border-radius: var(--radius-pill); padding: 1px 8px; color: var(--ink-60); }
    .va-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 14px; }
    .va-toolbar .search-bar { flex: 1 1 300px; min-width: 220px; margin-bottom: 0; }
    .btn.has-filters { border-color: var(--ruby-red); color: var(--ruby-red); }
    .va-count { font-size: 0.82rem; color: var(--ink-50); margin-left: auto; }
    .va-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .va-card { border: 1px solid var(--border-light); border-radius: var(--radius-xl); padding: 14px; background: var(--card-white, #fff); cursor: pointer; display: flex; gap: 12px; align-items: center; transition: box-shadow .14s, border-color .14s; will-change: transform; content-visibility: auto; contain-intrinsic-size: 0 90px; }
    .va-card:hover { box-shadow: 0 2px 10px rgba(34,27,25,.08); border-color: #d8d0c5; }
    /* Skeleton loader */
    @keyframes va-shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
    .va-skeleton { background: linear-gradient(90deg, var(--icon-bg) 25%, #e8e4de 50%, var(--icon-bg) 75%); background-size: 200% 100%; animation: va-shimmer 1.4s ease infinite; border-radius: var(--radius-md); }
    .va-sk-circle { width: 54px; height: 54px; border-radius: 50%; flex-shrink: 0; }
    .va-sk-line { height: 0.78rem; margin-bottom: 8px; border-radius: 6px; }
    .va-skeleton-card { pointer-events: none; }
    .va-thumb { width: 54px; height: 54px; border-radius: 50%; object-fit: cover; object-position: top; background: var(--icon-bg); flex-shrink: 0; }
    .va-card .nm { font-weight: 600; font-size: 0.92rem; }
    .va-card .sub { font-size: 0.76rem; color: var(--ink-60); }
    .va-badge { font-size: 0.68rem; font-weight: 600; padding: 3px 9px; border-radius: var(--radius-pill); white-space: nowrap; }
    /* Antes so a atualizacao tinha marcador, e em texto solto: para saber que era
       "nova" voce dependia da AUSENCIA de uma linha discreta. Agora os dois casos
       sao marcados, entao nao existe estado ambiguo. */
    .va-tipo {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
      padding: 5px 12px; border-radius: var(--radius-pill); margin-bottom: 12px;
    }
    .va-tipo--nova { background: var(--icon-bg); color: var(--ink-70); border: 1px solid var(--border-light); }
    .va-tipo--atualizacao { background: #FEF3C7; color: #92400E; border: 1px solid #FCD34D; }
    .va-tipo--sem-pagina { background: #F3F4F6; color: #6B7280; border: 1px solid #D1D5DB; }
    .va-tipo svg { width: 13px; height: 13px; }
    /* Barra de decisao fixa no rodape do modal: perfis com bio longa exigiam
       rolar ate o fim so para achar os botoes. O bottom negativo compensa o
       padding de 32px do .modal-card, encostando a barra no fundo. */
    /* Aprovar e reprovar eram os dois vermelhos. Agora a cor separa avancar
       de desfazer, e a acao sem volta e a de menor peso visual — de proposito. */
    .va-btn-aprovar {
      background: var(--state-done, #0A9060);
      border-color: var(--state-done, #0A9060);
      color: #fff;
    }
    .va-btn-aprovar:hover { filter: brightness(0.94); }
    .va-btn-reprovar {
      background: transparent;
      border: 1px solid var(--border-light);
      color: var(--ink-60);
    }
    .va-btn-reprovar:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .va-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 18px;
      position: sticky;
      bottom: -32px;
      z-index: 3;
      background: var(--paper-white);
      border-top: 1px solid var(--border-light);
      padding: 14px 0 32px;
      margin-bottom: -32px;
    }
  </style>
</head>
<body class="page-light">
  <div class="page-container page-container--wide" id="pageRoot" style="display:none">
    <div class="page-header">
      <div>
        <h1 class="page-title">Validação de Equipe</h1>
        <p class="page-subtitle">Fluxo unificado de novos cadastros, atualizações e registros sem página.</p>
      </div>
    </div>

    <div class="va-funil" id="vaFunil"></div>

    <div class="va-toolbar">
      <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-40,#9c978e)" stroke-width="2" style="flex-shrink:0"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="vaSearch" placeholder="Buscar por nome ou código…" oninput="setBusca(this.value)">
      </div>
      <div style="position:relative">
        <!-- FILTRO-BTN-PADRAO-VA: botao de filtro padronizado. -->
        <button class="filter-toggle-btn" id="vaFilterToggle" onclick="toggleFilterPanel(event)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          Filtros <span class="filter-count-badge" id="vaFilterBadge" style="display:none">1</span>
        </button>
        <div class="filter-panel" id="vaFilterPanel">
          <div class="filter-panel-row">
            <span class="filter-panel-label">Tipo</span>
            <div class="filter-panel-chips" id="vaTipoChips"></div>
          </div>
          <div class="filter-panel-row">
            <span class="filter-panel-label">Contrato Social</span>
            <div class="filter-panel-chips" id="vaContratoChips"></div>
          </div>
          <div class="filter-panel-row">
            <span class="filter-panel-label">Unidade</span>
            <div class="filter-panel-chips" id="vaUnidadeChips"></div>
          </div>
          <div class="filter-panel-row" style="justify-content:flex-end;border-top:1px solid var(--border-light);padding-top:10px;margin-top:4px">
            <button class="filter-clear-btn" id="vaFilterClear" style="display:none" onclick="limparFiltros()">Limpar filtros</button>
          </div>
        </div>
      </div>
      <span class="va-count" id="vaCount"></span>
    </div>

    <div class="va-grid" id="vaGrid"></div>
    <div id="vaEmpty" style="display:none;text-align:center;padding:50px 0;color:var(--ink-50)">Nenhum registro nesta aba.</div>
  </div>

  <div class="modal-overlay" id="vaModal" onclick="fecharDetalhe(event)">
    <div class="modal-card" style="max-width:760px;width:96vw" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="fecharDetalhe()">&times;</button>
      <div id="vaDetalhe"><div style="padding:40px;text-align:center;opacity:0.5">Carregando…</div></div>
    </div>
  </div>

  <script src="utils.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="shell.js"></script>
  <script src="assessor-preview.js"></script>
  <script>
    /* STATUS derivado de STATUS_SOLICITACAO (config.js) — fonte única para evitar
       divergência de cores entre esta tela e o restante do sistema. */
    const STATUS = (function () {
      const m = {};
      const lista = (typeof STATUS_SOLICITACAO !== 'undefined' && Array.isArray(STATUS_SOLICITACAO))
        ? STATUS_SOLICITACAO : [];
      lista.forEach(function (s) {
        m[s.id] = { label: s.label, bg: s.bg, fg: s.text, accent: s.accent || s.text };
      });
      return m;
    })();

    /* Metadata visual para cada tipo de categoria. */
    const TIPO_META = {
      'pagina':      { label: 'Nova Página',  bg: '#D1FAE5', fg: '#065F46' },
      'atualizacao': { label: 'Atualização',  bg: '#FEF3C7', fg: '#92400E' },
      'sem-pagina':  { label: 'Sem Página',   bg: '#F3F4F6', fg: '#6B7280' },
    };

    const FUNIL = ['todos', 'aguardando-validacao', 'ajustes-solicitados', 'aprovado', 'publicado', 'reprovado'];

    /* Concluir (publicar) é do marketing: gestor e admin. CH valida mas não conclui. */
    function podePublicar() {
      const r = (typeof Auth !== 'undefined' && Auth.getUserRole) ? Auth.getUserRole() : '';
      return r === 'gestor' || r === 'admin';
    }
    const CONTRATO_LABELS = { 'svn-capital': 'SVN Capital', 'svn-connect': 'SVN Connect', 'svn-investimentos': 'SVN Investimentos' };
    function contratoLabel(c) { return CONTRATO_LABELS[c] || c || '—'; }

    let LINHAS = [];
    let fTipo    = '';      // '' = todos os tipos
    let fStatus  = 'todos';
    let fBusca   = '';
    let fContrato = '';
    let fUnidade  = '';
    let detalheId = null;

    /* Cache do detalhe por ID: evita re-fetch ao reabrir o mesmo card.
       Invalidado em decidir() e salvarEdicao() para garantir dados frescos. */
    const _detalheCache = new Map();
    /* Timer de debounce da busca: impede re-render a cada tecla. */
    let _buscaTimer = null;

    function fmtData(v) { if (!v) return ''; try { return new Date(v).toLocaleDateString('pt-BR'); } catch (e) { return ''; } }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
    function badge(status) { const s = STATUS[status] || { label: status, bg: '#eee', fg: '#333' }; return '<span class="va-badge" style="background:' + s.bg + ';color:' + s.fg + '">' + esc(s.label) + '</span>'; }

    function renderSkeleton() {
      document.getElementById('vaGrid').innerHTML = Array.from({ length: 6 }, function () {
        return '<div class="va-card va-skeleton-card">' +
          '<div class="va-skeleton va-sk-circle"></div>' +
          '<div style="flex:1;min-width:0">' +
            '<div class="va-skeleton va-sk-line" style="width:38%;height:0.62rem;margin-bottom:7px"></div>' +
            '<div class="va-skeleton va-sk-line" style="width:68%"></div>' +
            '<div class="va-skeleton va-sk-line" style="width:50%;height:0.68rem;margin-top:2px"></div>' +
          '</div></div>';
      }).join('');
      document.getElementById('vaEmpty').style.display = 'none';
      document.getElementById('vaCount').textContent = '';
    }

    async function carregar() {
      renderSkeleton();
      try {
        const r = await fetch('/api/assessor-aprovacoes');
        if (!r.ok) throw new Error('falha');
        const j = await r.json();
        /* Mais recentes primeiro — independente do tipo. */
        LINHAS = (j.linhas || []).sort(function (a, b) {
          return new Date(b.criado_em || 0) - new Date(a.criado_em || 0);
        });
      } catch (e) { LINHAS = []; }
      renderTipoChips();
      renderContratoChips();
      renderUnidades();
      renderFunil();
      renderLista();
      atualizarFilterUI();
    }

    /* Registros após aplicar todos os filtros activos (exceto fStatus — o funil
       filtra em cima deste resultado). */
    function base() {
      const q = fBusca.trim().toLowerCase();
      return LINHAS.filter(function (l) {
        return (!fTipo    || l.categoria === fTipo) &&
               (!fContrato || (l.contrato_social || '') === fContrato) &&
               (!fUnidade  || (l.unidade || '') === fUnidade) &&
               (!q || String(l.nome || '').toLowerCase().includes(q) ||
                      String(l.codigo_assessor || '').toLowerCase().includes(q));
      });
    }
    function distintos(campo) { return [...new Set(LINHAS.map(l => l[campo]).filter(Boolean))].sort(); }

    function renderTipoChips() {
      const opcoes = [
        { id: '',            label: 'Ver todos' },
        { id: 'pagina',      label: 'Novas Páginas' },
        { id: 'atualizacao', label: 'Atualizações' },
        { id: 'sem-pagina',  label: 'Sem Página' },
      ];
      document.getElementById('vaTipoChips').innerHTML = opcoes.map(function (t) {
        return '<button class="filter-chip' + (fTipo === t.id ? ' active' : '') + '" onclick="setTipo(this,\'' + t.id + '\')">' + t.label + '</button>';
      }).join('');
    }
    function renderContratoChips() {
      const cts = distintos('contrato_social');
      document.getElementById('vaContratoChips').innerHTML =
        '<button class="filter-chip' + (!fContrato ? ' active' : '') + '" onclick="setContrato(this,\'\')">Todos</button>' +
        cts.map(c => '<button class="filter-chip' + (fContrato === c ? ' active' : '') + '" onclick="setContrato(this,\'' + esc(c) + '\')">' + esc(contratoLabel(c)) + '</button>').join('');
    }
    function renderUnidades() {
      const uns = distintos('unidade');
      document.getElementById('vaUnidadeChips').innerHTML =
        '<button class="filter-chip' + (!fUnidade ? ' active' : '') + '" onclick="setUnidade(this,\'\')">Todas</button>' +
        uns.map(u => '<button class="filter-chip' + (fUnidade === u ? ' active' : '') + '" onclick="setUnidade(this,\'' + esc(u) + '\')">' + esc(u) + '</button>').join('');
    }

    /* Funil sempre visível — contagens em uma única passagem sobre base()
       para não fazer 6 .filter() separados sobre o mesmo array. */
    function renderFunil() {
      const el = document.getElementById('vaFunil');
      el.style.display = '';
      const b = base();
      /* Contagem em O(n) em vez de O(n*6). */
      const counts = { todos: b.length };
      for (let i = 0; i < b.length; i++) {
        const s = b[i].status;
        counts[s] = (counts[s] || 0) + 1;
      }
      el.innerHTML = FUNIL.map(function (f) {
        const n = counts[f] || 0;
        const st = STATUS[f] || { label: 'Todos', accent: 'var(--carbon-black)', bg: 'var(--icon-bg)' };
        const active = fStatus === f;
        const style = active ? 'style="--etapa:' + (st.accent || 'var(--carbon-black)') + ';--etapa-bg:' + (st.bg || 'var(--icon-bg)') + '33;"' : '';
        return '<div class="stat-card' + (active ? ' active' : '') + '" ' + style + ' onclick="setStatus(\'' + f + '\')">' +
          '<div class="stat-number">' + n + '</div>' +
          '<div class="stat-label">' + (f === 'todos' ? 'Todos' : esc(st.label)) + '</div></div>';
      }).join('');
    }

    function renderLista() {
      const b   = base();
      const arr = fStatus !== 'todos' ? b.filter(l => l.status === fStatus) : b;
      const grid = document.getElementById('vaGrid');
      document.getElementById('vaEmpty').style.display = arr.length ? 'none' : 'block';
      document.getElementById('vaCount').textContent = arr.length + ' registro(s)';
      grid.innerHTML = arr.map(function (l) {
        const foto = l.foto_url
          ? '<img class="va-thumb" src="' + esc(l.foto_url) + '" alt="" loading="lazy" decoding="async">'
          : '<div class="va-thumb"></div>';
        const tm = TIPO_META[l.categoria] || { label: l.categoria || '—', bg: '#eee', fg: '#555' };
        const tipoTag = '<span style="display:inline-block;font-size:0.65rem;font-weight:700;text-transform:uppercase;' +
          'letter-spacing:.04em;padding:2px 8px;border-radius:20px;background:' + tm.bg + ';color:' + tm.fg + ';margin-bottom:4px">' +
          tm.label + '</span>';
        const stBadge = '<div style="margin-top:4px">' + badge(l.status) +
          (l.ciclo > 1 ? ' <span class="sub">' + l.ciclo + '\u00AA rodada de ajustes</span>' : '') + '</div>';
        return '<div class="va-card" onclick="abrirDetalhe(' + l.solicitacao_id + ')">' + foto +
          '<div style="flex:1;min-width:0">' +
          tipoTag +
          '<div class="nm">' + esc(l.nome || '—') + '</div>' +
          '<div class="sub">' + esc(l.unidade || '') + (l.codigo_assessor ? ' · ' + esc(l.codigo_assessor) : '') + '</div>' +
          (l.criado_em ? '<div class="sub" style="opacity:0.7;font-size:0.72rem;margin-top:2px">Solicitado em ' + fmtData(l.criado_em) + '</div>' : '') +
          stBadge +
          '</div></div>';
      }).join('');
    }

    function setTipo(el, t)    { fTipo = t;    fStatus = 'todos'; [...document.querySelectorAll('#vaTipoChips .filter-chip')].forEach(x => x.classList.remove('active')); el.classList.add('active'); renderFunil(); renderLista(); atualizarFilterUI(); }
    function setStatus(f)       { fStatus = f;  renderFunil(); renderLista(); }
    function setBusca(v)        { fBusca = v;   clearTimeout(_buscaTimer); _buscaTimer = setTimeout(function () { renderFunil(); renderLista(); }, 200); }
    function setContrato(el, c) { fContrato = c; [...document.querySelectorAll('#vaContratoChips .filter-chip')].forEach(x => x.classList.remove('active')); el.classList.add('active'); renderFunil(); renderLista(); atualizarFilterUI(); }
    function setUnidade(el, u)  { fUnidade = u;  [...document.querySelectorAll('#vaUnidadeChips .filter-chip')].forEach(x => x.classList.remove('active')); el.classList.add('active'); renderFunil(); renderLista(); atualizarFilterUI(); }
    function limparFiltros()    { fTipo = ''; fContrato = ''; fUnidade = ''; renderTipoChips(); renderContratoChips(); renderUnidades(); renderFunil(); renderLista(); atualizarFilterUI(); }
    function atualizarFilterUI() {
      const ativos = (fTipo ? 1 : 0) + (fContrato ? 1 : 0) + (fUnidade ? 1 : 0);
      const badgeEl = document.getElementById('vaFilterBadge'), clear = document.getElementById('vaFilterClear'), toggle = document.getElementById('vaFilterToggle');
      if (ativos > 0) { badgeEl.textContent = ativos; badgeEl.style.display = ''; clear.style.display = ''; toggle.classList.add('has-filters'); }
      else            { badgeEl.style.display = 'none'; clear.style.display = 'none'; toggle.classList.remove('has-filters'); }
    }
    function toggleFilterPanel(e) { if (e) e.stopPropagation(); document.getElementById('vaFilterPanel').classList.toggle('open'); }
    document.addEventListener('click', function (e) {
      const panel = document.getElementById('vaFilterPanel');
      if (panel && panel.classList.contains('open') &&
          !panel.contains(e.target) &&
          !document.getElementById('vaFilterToggle').contains(e.target)) panel.classList.remove('open');
    });

    async function abrirDetalhe(id) {
      detalheId = id;
      document.getElementById('vaModal').classList.add('visible');
      /* Skeleton do modal — aparece só se não há cache. */
      let data = _detalheCache.get(id);
      if (!data) {
        document.getElementById('vaDetalhe').innerHTML =
          '<div style="padding:24px 0 8px">' +
            '<div class="va-skeleton va-sk-line" style="width:28%;height:0.6rem;margin-bottom:16px"></div>' +
            '<div class="va-skeleton va-sk-line" style="width:55%;height:1.1rem;margin-bottom:8px"></div>' +
            '<div class="va-skeleton va-sk-line" style="width:40%;height:0.72rem;margin-bottom:24px"></div>' +
            '<div class="va-skeleton" style="width:100%;height:200px;border-radius:var(--radius-xl);margin-bottom:16px"></div>' +
            '<div class="va-skeleton va-sk-line" style="width:70%"></div>' +
          '</div>';
        try { const r = await fetch('/api/assessor-aprovacoes/' + id); data = await r.json(); _detalheCache.set(id, data); }
        catch (e) { document.getElementById('vaDetalhe').innerHTML = '<div style="padding:30px;text-align:center;color:var(--danger)">Erro ao carregar.</div>'; return; }
      }
      window._vaDados = data;
      const resumo = data.resumo || {};
      const pub    = data.publicacao || {};
      const dados  = data.dados || {};
      if (!dados.foto_url && !dados.foto_perfil && pub.foto_url) dados.foto_url = pub.foto_url;

      /* Todos os tipos seguem o mesmo fluxo de aprovação agora.
         URL da página é obrigatória apenas para 'pagina' (nova); opcional para
         'atualizacao' e 'sem-pagina' (não há página nova para publicar). */
      const editavel   = resumo.status === 'aguardando-validacao' || resumo.status === 'ajustes-solicitados';
      const urlOpcional = resumo.categoria === 'atualizacao' || resumo.categoria === 'sem-pagina';
      const ehAdmin    = typeof Auth !== 'undefined' && Auth.getUserRole && Auth.getUserRole() === 'admin';

      let rodape;
      if (editavel) {
        rodape =
          '<div style="margin-top:16px">' +
            '<div style="font-size:0.72rem;color:var(--ink-50);margin-bottom:4px">Observação interna (para o marketing) <span style="opacity:0.7">— não é enviada ao assessor</span></div>' +
            '<textarea id="vaObs" style="width:100%;box-sizing:border-box;min-height:56px;font:inherit;font-size:0.85rem;padding:8px 10px;border:1px solid var(--border-light);border-radius:var(--radius-md);resize:vertical" placeholder="Direções para o time de marketing. Obrigatória ao solicitar ajustes ou reprovar; opcional ao aprovar."></textarea>' +
          '</div>' +
          '<div class="va-actions">' +
            '<button class="btn va-btn-aprovar" onclick="decidir(\'aprovado\')">Aprovar</button>' +
            '<button class="btn btn-secondary" onclick="decidir(\'ajustes\')">Solicitar ajustes</button>' +
            '<button class="btn va-btn-reprovar" onclick="confirmarReprovar()">Reprovar</button>' +
          '</div><div id="vaMsg" style="margin-top:10px;font-size:0.82rem"></div>';
      } else if (resumo.status === 'aprovado' && podePublicar()) {
        rodape =
          '<div class="va-actions" style="align-items:center">' +
            '<div style="width:100%;margin-bottom:10px">' +
              '<label for="vaUrlPublicada" style="display:block;font-size:0.78rem;color:var(--ink-60);margin-bottom:4px">Link da página publicada' +
                (urlOpcional ? ' <span style="font-weight:400;opacity:0.7">(opcional)</span>' : '') + '</label>' +
              '<input id="vaUrlPublicada" type="url" inputmode="url" placeholder="https://svninvestimentos.com.br/assessores/..." style="width:100%;box-sizing:border-box;font:inherit;font-size:0.85rem;padding:8px 10px;border:1px solid var(--border-light);border-radius:var(--radius-md)">' +
            '</div>' +
            '<span class="sub" style="font-size:0.8rem;color:var(--ink-50);margin-right:auto">' +
              (urlOpcional ? 'Preencha o link só se a mudança merecer um aviso ao assessor — com o campo vazio, conclui sem enviar e-mail.'
                           : 'Assim que a página estiver no ar, cole o link e marque como concluído.') +
            '</span>' +
            '<button class="btn btn-primary" onclick="concluirPagina()">Marcar como concluído</button>' +
          '</div><div id="vaMsg" style="margin-top:10px;font-size:0.82rem"></div>';
      } else {
        rodape = '<div class="va-actions"><span class="sub" style="font-size:0.8rem;color:var(--ink-50)">Perfil já ' + (STATUS[resumo.status] ? STATUS[resumo.status].label.toLowerCase() : resumo.status) + '.</span></div>';
      }

      /* Admin pode corrigir dados do perfil em qualquer status. */
      if (ehAdmin) {
        rodape = '<div style="text-align:right;margin-bottom:8px"><button class="btn btn-secondary" style="padding:4px 12px;font-size:0.78rem" onclick="abrirEdicao()">Editar dados</button></div>' + rodape;
      }

      /* Cabeçalho com tag visual do tipo. */
      const tipoClasse = resumo.categoria === 'atualizacao' ? 'va-tipo--atualizacao'
                       : resumo.categoria === 'sem-pagina'  ? 'va-tipo--sem-pagina'
                       : 'va-tipo--nova';
      const tipoIcone  = resumo.categoria === 'atualizacao'
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>Atualização de página'
        : resumo.categoria === 'sem-pagina'
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Sem Página'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Nova solicitação';

      const cabecalho =
        '<div class="va-tipo ' + tipoClasse + '">' + tipoIcone + '</div>' +
        (pub.observacao ? '<div class="alert-card alert-info" style="margin:0 0 12px;font-size:0.82rem"><strong>Observação interna anterior:</strong> ' + esc(pub.observacao) + '</div>' : '') +
        (resumo.ciclo > 1 ? '<div style="text-align:right;font-size:0.74rem;color:var(--ink-50);margin-bottom:6px">' + resumo.ciclo + '\u00AA rodada de ajustes</div>' : '');

      document.getElementById('vaDetalhe').innerHTML = cabecalho +
        '<div id="vaPreview"></div>' +
        '<p style="text-align:center;margin:8px 0 0;font-size:0.72rem;opacity:0.45">Simulação. O layout final pode variar conforme o site institucional.</p>' +
        rodape;

      const internos = [
        { label: 'Código',       value: dados.codigo_assessor },
        { label: 'Contrato',     value: contratoLabel(dados.contrato_social) },
        { label: 'Unidade',      value: dados.unidade },
        { label: 'Solicitada em', value: fmtData(resumo.criado_em) },
      ];
      if (window.renderAssessorPreview) {
        window.renderAssessorPreview(document.getElementById('vaPreview'), dados, { internos, statusHtml: badge(resumo.status) });
      }
    }

    function abrirEdicao() {
      const d = (window._vaDados && window._vaDados.dados) || {};
      const contratos = (window._svnFormSchemas && window._svnFormSchemas.contratos) || [];
      const unidades  = typeof UNIDADES_SVN !== 'undefined' ? UNIDADES_SVN : [];
      const optSel = (arr, val, getV, getL) =>
        arr.map(function (o) {
          const vv = getV(o), ll = getL(o);
          return '<option value="' + esc(vv) + '"' + (String(vv) === String(val) ? ' selected' : '') + '>' + esc(ll) + '</option>';
        }).join('');
      const contratoOpts = '<option value="">Selecione</option>' +
        optSel(contratos, d.contrato_social, o => o.value != null ? o.value : o, o => o.label != null ? o.label : o);
      const unidadeOpts = '<option value="">Selecione</option>' +
        optSel(unidades, d.unidade, o => o.nome != null ? o.nome : o, o => o.nome != null ? o.nome : o);
      const campo = (lab, html) => '<div style="margin-bottom:12px"><label style="display:block;font-size:0.74rem;color:var(--ink-50);margin-bottom:4px">' + lab + '</label>' + html + '</div>';
      const inp   = (id, val) => '<input id="' + id + '" style="width:100%;box-sizing:border-box;font:inherit;font-size:0.88rem;padding:8px 10px;border:1px solid var(--border-light);border-radius:var(--radius-md)" value="' + esc(val || '') + '">';
      const sel   = (id, opts) => '<select id="' + id + '" style="width:100%;box-sizing:border-box;font:inherit;font-size:0.88rem;padding:8px 10px;border:1px solid var(--border-light);border-radius:var(--radius-md)">' + opts + '</select>';
      const codAtual = String(d.codigo_assessor || '').replace(/^A/i, '');
      document.getElementById('vaDetalhe').innerHTML =
        '<div style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ruby-red);margin-bottom:12px">Editar dados do perfil</div>' +
        campo('Nome completo', inp('edNome', d.nome_completo || d.nome)) +
        campo('Código do assessor', '<div style="display:flex;align-items:stretch"><span style="display:flex;align-items:center;padding:0 10px;border:1px solid var(--border-light);border-right:0;border-radius:var(--radius-md) 0 0 var(--radius-md);background:var(--icon-bg);color:var(--ink-60);font-weight:600">A</span><input id="edCodigo" inputmode="numeric" style="flex:1;min-width:0;font:inherit;font-size:0.88rem;padding:8px 10px;border:1px solid var(--border-light);border-radius:0 var(--radius-md) var(--radius-md) 0" value="' + esc(codAtual) + '" oninput="this.value=this.value.replace(/\\D/g,\'\')"></div>') +
        campo('Contrato social', sel('edContrato', contratoOpts)) +
        campo('Unidade', sel('edUnidade', unidadeOpts)) +
        '<div class="va-actions">' +
          '<button class="btn btn-primary" onclick="salvarEdicao()">Salvar correções</button>' +
          '<button class="btn btn-secondary" onclick="abrirDetalhe(detalheId)">Cancelar</button>' +
        '</div><div id="vaEditMsg" style="margin-top:10px;font-size:0.82rem"></div>';
      window._vaEditar = true;
    }

    async function salvarEdicao() {
      const msg = document.getElementById('vaEditMsg');
      msg.style.color = 'var(--ink-50)'; msg.textContent = 'Salvando…';
      const num = (document.getElementById('edCodigo').value || '').replace(/\D/g, '');
      const payload = {
        nome: document.getElementById('edNome').value,
        codigo_assessor: num ? 'A' + num : '',
        contrato_social: document.getElementById('edContrato').value,
        unidade: document.getElementById('edUnidade').value,
      };
      try {
        const r = await fetch('/api/assessor-aprovacoes/' + detalheId, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || 'Falha ao salvar.');
        _detalheCache.delete(detalheId);   // força re-fetch do modal com dados novos
        await abrirDetalhe(detalheId);
        await carregar();                  // lista/filtros podem mudar (nome, unidade)
      } catch (e) {
        msg.style.color = 'var(--danger)'; msg.textContent = e.message || 'Erro ao salvar.';
      }
    }

    function confirmarReprovar() {
      const obs = (document.getElementById('vaObs') || {}).value || '';
      if (!obs.trim()) {
        const msg = document.getElementById('vaMsg');
        if (msg) { msg.style.color = 'var(--danger)'; msg.textContent = 'Escreva a observação interna explicando o motivo antes de reprovar.'; }
        return;
      }
      if (confirm('Reprovar este perfil?\n\nO assessor precisará enviar uma nova solicitação do zero.')) decidir('reprovado');
    }

    function concluirPagina() {
      const campo = document.getElementById('vaUrlPublicada');
      const msg   = document.getElementById('vaMsg');
      const url   = (campo && campo.value || '').trim();
      const erro  = t => { if (msg) { msg.style.color = 'var(--danger)'; msg.textContent = t; } if (campo) campo.focus(); };
      /* URL obrigatória apenas para nova página; opcional para atualização e sem-página. */
      const cat = window._vaDados && window._vaDados.resumo && window._vaDados.resumo.categoria;
      const urlOpcional = cat === 'atualizacao' || cat === 'sem-pagina';
      if (!url && !urlOpcional) return erro('Cole o link da página publicada antes de concluir.');
      if (!url && urlOpcional)  return decidir('publicado', {});
      let ok = false;
      try { const u = new URL(url); ok = u.protocol === 'http:' || u.protocol === 'https:'; } catch (e) { ok = false; }
      if (!ok) return erro('O link precisa ser um endereço válido, começando com https://');
      decidir('publicado', { url_publicada: url });
    }

    /* Mapa de decisao → status local (evita re-fetch da lista inteira). */
    const _STATUS_MAP = { aprovado: 'aprovado', ajustes: 'ajustes-solicitados', reprovado: 'reprovado', publicado: 'publicado' };

    async function decidir(decisao, extra) {
      const obs = (document.getElementById('vaObs') || {}).value || '';
      const msg = document.getElementById('vaMsg');
      if ((decisao === 'ajustes' || decisao === 'reprovado') && !obs.trim()) {
        msg.style.color = 'var(--danger)';
        msg.textContent = decisao === 'ajustes'
          ? 'Descreva na observação o que precisa ser ajustado (para o marketing encaminhar).'
          : 'Escreva o motivo da reprovação na observação (uso interno).';
        return;
      }
      msg.style.color = 'var(--ink-50)'; msg.textContent = 'Salvando…';
      try {
        const r = await fetch('/api/assessor-aprovacoes/' + detalheId + '/decisao', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ decisao, observacao: obs, ajustes: [], ...(extra || {}) }),
        });
        if (!r.ok) throw new Error('falha');
        /* Update otimista: atualiza o item local em vez de recarregar a lista inteira.
           O modal fecha e o card na lista já mostra o status novo imediatamente. */
        _detalheCache.delete(detalheId);
        const novoStatus = _STATUS_MAP[decisao] || decisao;
        const idx = LINHAS.findIndex(function (l) { return l.solicitacao_id === detalheId; });
        if (idx !== -1) {
          LINHAS[idx] = Object.assign({}, LINHAS[idx], { status: novoStatus });
          if (decisao === 'ajustes') LINHAS[idx].ciclo = (LINHAS[idx].ciclo || 1) + 1;
        }
        fecharDetalhe();
        renderFunil();
        renderLista();
      } catch (e) { msg.style.color = 'var(--danger)'; msg.textContent = 'Erro ao registrar a decisão.'; }
    }

    function fecharDetalhe(e) {
      if (e && e.target !== document.getElementById('vaModal')) return;
      document.getElementById('vaModal').classList.remove('visible');
      detalheId = null;
    }

    async function init() {
      try { if (typeof _configReady !== 'undefined') await _configReady; } catch (e) {}
      await Auth.init();
      if (!Auth.isAuthenticated()) { window.location.href = '/auth/login?redirect=/validacao-assessores.html'; return; }
      const role = Auth.getUserRole ? Auth.getUserRole() : (Auth.getUser && Auth.getUser().role);
      if (role !== 'capital_humano' && role !== 'gestor' && role !== 'admin') { window.location.href = '/dashboard.html'; return; }
      document.getElementById('pageRoot').style.display = '';
      if (typeof Shell !== 'undefined' && Shell.render) {
        Shell.render({ activeRoute: 'validacao-assessores', contentEl: document.getElementById('pageRoot') });
      }
      carregar();
    }
    init();
  </script>
</body>
</html>
