<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{const s=JSON.parse(localStorage.getItem('svn_layout_state')||'{}');if(s.isAdmin)document.documentElement.dataset.preShell='admin';}catch(e){}})()</script>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#AC3631" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sugestão de Conteúdo - Hub SVN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600;6..12,700&family=Taviraj:wght@300;400&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600;6..12,700&family=Taviraj:wght@300;400&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600;6..12,700&family=Taviraj:wght@300;400&display=swap"></noscript>
  <link rel="stylesheet" href="style.css">
  <style>
    .check-grupo { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 6px; }
    .check-row { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.95rem; }
    .check-row input[type="checkbox"] { width: 17px; height: 17px; accent-color: #AC3631; cursor: pointer; }
  </style>
</head>
<body class="page-light">
  <div id="pageContent">
  <div class="page-container page-container--narrow">

    <div class="form-card">
      <div class="form-progress"><div class="form-progress-bar" id="progressBar" style="width:100%"></div></div>
      <div class="flex-between">
        <h2 class="text-md-medium">Sugestão de Conteúdo</h2>
      </div>
      <hr class="sep">

      <div class="alert-card alert-warning">
        <div class="alert-title">Canal de sugestões</div>
        <div class="alert-text">Viu um tema que renderia um bom conteúdo da SVN? Conta pra gente. As sugestões vão direto para a pauta do time de conteúdo — quanto mais contexto, melhor a priorização.</div>
      </div>

      <div class="field">
        <label>Qual tema ou assunto você gostaria de ver em um conteúdo da SVN? <span class="text-ruby">*</span></label>
        <textarea id="tema" placeholder="Ex.: como funciona a tributação de fundos imobiliários para quem está começando" required></textarea>
      </div>
      <div class="field">
        <label>Esse tema surgiu a partir de alguma dúvida ou situação real com seus clientes?</label>
        <textarea id="origem_duvida" placeholder="Se sim, conte o contexto — ajuda muito na priorização"></textarea>
      </div>
      <div class="field">
        <label>Em qual formato você imagina esse conteúdo?</label>
        <div class="check-grupo" id="formatosGrupo">
          <label class="check-row"><input type="checkbox" value="Carrossel"> Carrossel</label>
          <label class="check-row"><input type="checkbox" value="Reels"> Reels</label>
          <label class="check-row"><input type="checkbox" value="Post"> Post</label>
        </div>
      </div>
      <div class="field">
        <label>Para qual perfil de cliente esse conteúdo seria útil?</label>
        <input type="text" id="perfil_cliente" placeholder="Ex.: clientes conservadores perto da aposentadoria">
      </div>
      <div class="field">
        <label>Referências <span class="text-muted" style="font-weight:400;font-size:0.85em">(opcional)</span></label>
        <textarea id="referencias" placeholder="Cole aqui links de conteúdos semelhantes ao que você está sugerindo"></textarea>
      </div>
      <div class="section-divider">
        <div id="submitError" class="alert-card alert-danger" style="display:none;margin-bottom:16px"></div>
        <div id="formStatusArea" style="display:none;margin-top:16px"></div>
        <div class="form-nav">
          <button class="btn btn-primary btn-submit-gold" id="btnSubmit" onclick="submitForm()">Enviar sugestão</button>
        </div>
      </div>
    </div>
  </div>


  </div>
  <script src="utils.js"></script>
  <script src="upload-feedback.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="shell.js"></script>
  <script src="form-core.js"></script>
  <script>

    const TIPO = 'sugestao-conteudo';

    async function init() {
      await FormCore.initForm({
        tipo: TIPO,
        draft: true,
      });
    }

    async function submitForm() {
      if (!FormCore.validateRequired()) return;
      var formatos = Array.prototype.slice
        .call(document.querySelectorAll('#formatosGrupo input[type="checkbox"]:checked'))
        .map(function (c) { return c.value; })
        .join(', ');
      var referencias = document.getElementById('referencias').value.trim();
      var dados = {
        nome: Auth.getUserName(),
        tema: document.getElementById('tema').value,
        origem_duvida: document.getElementById('origem_duvida').value || 'não informado',
        formatos: formatos || 'não informado',
        perfil_cliente: document.getElementById('perfil_cliente').value || 'não informado',
      };
      if (referencias) dados.referencias = referencias;
      await FormCore.submit({ tipo: TIPO, dados: dados });
    }

    init();
  </script>
</body>
</html>
